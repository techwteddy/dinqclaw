name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create dummy .env for CI
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET=dummy-secret-for-ci-only
          COMPOSIO_API_KEY=dummy
          TELEGRAM_BOT_TOKEN=dummy
          TELEGRAM_BOT_USERNAME=dummy_bot
          TELEGRAM_WEBHOOK_SECRET=dummy
          NEXT_PUBLIC_APP_URL=https://dummy.vercel.app
          GOOGLE_GENERATIVE_AI_API_KEY=dummy
          NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY=dummy
          CRON_SECRET=dummy
          EOF

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
